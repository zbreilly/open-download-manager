name: windows-linux

# Windows (x64) installers and Linux .deb (Debian/Ubuntu) and .rpm
# (Fedora) packages for x64 and ARM64. The Windows installer and each Linux
# package (in a clean Debian or Fedora container on its own arch) are
# installed, launched, and used for a real download through the browser
# bridge. A v* tag also builds the macOS app and drafts a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "apps/macos/**"
      - ".github/workflows/macos-native.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: windows-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows
      - name: Frontend and extension
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          bash extension/build.sh
      - name: Bundle (NSIS + MSI)
        working-directory: src-tauri
        run: |
          mkdir -p ../ci-out
          # the CLI version is pinned in ui/package.json
          ../ui/node_modules/.bin/tauri build --bundles nsis,msi -- --locked 2>&1 | tee ../ci-out/build.log
      - name: Install silently, launch, download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Open Download Manager\*.exe","$env:ProgramFiles\Open Download Manager\*.exe" -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $app) { Write-Error "installed app not found"; exit 1 }
          "installed: $($app.FullName)" | Tee-Object ci-out/install.log
          # pairing key for this run: the app and the test script share it
          $env:ODM_BRIDGE_KEY = -join ((1..32) | ForEach-Object { '{0:x2}' -f (Get-Random -Maximum 256) })
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep 15
          if ($p.HasExited) { Write-Error "app exited early ($($p.ExitCode))"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("ci-out/$name")
          }
          Shot "windows.png"
          $env:PYTHON = 'python'
          $dl = "$($env:USERPROFILE -replace '\\','/')/Downloads"
          & "C:\Program Files\Git\bin\bash.exe" scripts/ci/e2e-download.sh $dl 2>&1 | Tee-Object -Append ci-out/install.log
          $rc = $LASTEXITCODE
          Shot "windows-after-download.png"
          Stop-Process -Id $p.Id -Force
          if ($rc -ne 0) { Write-Error "end-to-end download failed"; exit 1 }
          "launch and download ok" | Tee-Object -Append ci-out/install.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: logs-windows-x64
          path: ci-out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenDownloadManager-Windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  linux:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-${{ matrix.arch }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm zip
      - name: Frontend and extension
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          bash extension/build.sh
      - name: Bundle (.deb + .rpm)
        working-directory: src-tauri
        run: |
          mkdir -p ../ci-out
          # the CLI version is pinned in ui/package.json
          ../ui/node_modules/.bin/tauri build --bundles deb,rpm -- --locked 2>&1 | tee ../ci-out/build.log
      - name: Package info
        run: |
          ls -l target/release/bundle/deb target/release/bundle/rpm | tee ci-out/packages.txt
          dpkg-deb -I target/release/bundle/deb/*.deb | tee -a ci-out/packages.txt
          rpm -qpR target/release/bundle/rpm/*.rpm | tee -a ci-out/packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: logs-build-linux-${{ matrix.arch }}
          path: ci-out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenDownloadManager-Linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  install-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        distro: [debian, fedora]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    container: ${{ matrix.distro == 'debian' && 'debian:stable' || 'fedora:latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OpenDownloadManager-Linux-${{ matrix.arch }}
          path: pkg
      - name: Install package
        run: |
          mkdir -p ci-out
          if [ "${{ matrix.distro }}" = debian ]; then
            apt-get update
            apt-get install -y ./pkg/deb/*.deb xvfb xauth imagemagick dbus-x11 procps curl python3 git nodejs openssl 2>&1 | tee ci-out/install.log
          else
            dnf install -y ./pkg/rpm/*.rpm xorg-x11-server-Xvfb ImageMagick dbus-x11 procps-ng curl python3 git nodejs openssl 2>&1 | tee ci-out/install.log
          fi
          command -v open-download-manager | tee -a ci-out/install.log
      # only the e2e scripts are needed (the container job has no source),
      # and the extension's sealing code they send requests with
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            extension/src
          path: src
      - name: Launch, download, screenshot
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          export DISPLAY=:99 HOME=/root
          # pairing key for this run: the app and the test script share it
          export ODM_BRIDGE_KEY="$(openssl rand -hex 32)"
          dbus-launch open-download-manager > ci-out/app.log 2>&1 &
          sleep 15
          pgrep -f open-download-manage[r] || { echo "app exited early"; cat ci-out/app.log; exit 1; }
          import -display :99 -window root ci-out/screen.png || true
          bash src/scripts/ci/e2e-download.sh /root/Downloads 2>&1 | tee -a ci-out/install.log
          import -display :99 -window root ci-out/screen-after-download.png || true
          pkill -f open-download-manage[r] || true
          echo "launch and download ok" >> ci-out/install.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: logs-${{ matrix.distro }}-${{ matrix.arch }}
          path: ci-out/

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    permissions:
      contents: write
    uses: ./.github/workflows/macos-native.yml
    with:
      universal: true

  report:
    needs: [checks, windows, linux, install-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: logs-*
          path: ci-out
      - name: Publish logs to the ci-output-desktop branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUMMARY: "checks=${{ needs.checks.result }} windows=${{ needs.windows.result }} linux=${{ needs.linux.result }} install-test=${{ needs.install-test.result }}"
        run: |
          mkdir -p ci-out
          cd ci-out
          printf '%s\n' "run $GITHUB_RUN_ID · commit $GITHUB_SHA" "$SUMMARY" > RUN.txt
          git init -q
          git checkout -q -b ci-output-desktop
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for $GITHUB_SHA"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q -f "https://github.com/$REPO.git" ci-output-desktop

  release:
    needs: [windows, linux, install-test, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # build provenance for the installers (signed by GitHub, not by us)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag matches the version
        run: scripts/ci/check-versions.sh "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: OpenDownloadManager-*
          path: out
          merge-multiple: true
      # The installers are not code-signed. So that a download can still be
      # checked: SHA-256 sums of every file, and a provenance attestation
      # tying each file to this workflow run
      # (gh attestation verify <file> --repo <owner>/<repo>).
      - name: Checksums
        run: |
          mkdir release
          find out -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # attestations are available to public repositories (and to private
        # ones only on GitHub Enterprise Cloud)
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: release/*
