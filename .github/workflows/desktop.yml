name: linux-webview

# The webview (Tauri) Linux packages, kept as the fallback for distributions
# too old for the native apps: .deb (Debian/Ubuntu) and .rpm (Fedora) for
# x64 and ARM64, each installed in a clean container, launched, and used for
# a real download through the browser bridge.
#
# A v* tag also builds the native apps (macOS, Windows, Linux) through their
# own workflows and drafts a release with everything.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "apps/**"
      - "packaging/**"
      - ".github/workflows/macos-native.yml"
      - ".github/workflows/windows-native.yml"
      - ".github/workflows/linux-native.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: linux-webview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  linux:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-${{ matrix.arch }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm zip
      - name: Frontend and extension
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          bash extension/build.sh
      - name: Bundle (.deb + .rpm)
        working-directory: src-tauri
        run: |
          mkdir -p ../ci-out
          # the CLI version is pinned in ui/package.json
          ../ui/node_modules/.bin/tauri build --bundles deb,rpm 2>&1 | tee ../ci-out/build.log
      - name: Name the packages as the webview fallback
        run: |
          # the native packages (linux-native workflow) are open-download-manager_*;
          # both install the package "open-download-manager", so one replaces the other
          for f in target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm; do
            mv "$f" "$(dirname "$f")/open-download-manager-webview-$(basename "$f" | sed 's/^Open Download Manager[_-]//')"
          done
      - name: Package info
        run: |
          ls -l target/release/bundle/deb target/release/bundle/rpm | tee ci-out/packages.txt
          dpkg-deb -I target/release/bundle/deb/*.deb | tee -a ci-out/packages.txt
          rpm -qpR target/release/bundle/rpm/*.rpm | tee -a ci-out/packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: logs-build-linux-${{ matrix.arch }}
          path: ci-out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenDownloadManager-Linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  install-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        distro: [debian, fedora]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    container: ${{ matrix.distro == 'debian' && 'debian:stable' || 'fedora:latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OpenDownloadManager-Linux-${{ matrix.arch }}
          path: pkg
      - name: Install package
        run: |
          mkdir -p ci-out
          if [ "${{ matrix.distro }}" = debian ]; then
            apt-get update
            apt-get install -y ./pkg/deb/*.deb xvfb xauth imagemagick dbus-x11 procps curl python3 git 2>&1 | tee ci-out/install.log
          else
            dnf install -y ./pkg/rpm/*.rpm xorg-x11-server-Xvfb ImageMagick dbus-x11 procps-ng curl python3 git 2>&1 | tee ci-out/install.log
          fi
          command -v open-download-manager | tee -a ci-out/install.log
      # only the e2e scripts are needed (the container job has no source)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
          path: src
      - name: Launch, download, screenshot
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          export DISPLAY=:99 HOME=/root
          # the app downloads this once the e2e script serves it
          ODM_E2E_URL=http://127.0.0.1:8919/odm-ci-e2e.bin dbus-launch open-download-manager > ci-out/app.log 2>&1 &
          sleep 15
          pgrep -f open-download-manage[r] || { echo "app exited early"; cat ci-out/app.log; exit 1; }
          import -display :99 -window root ci-out/screen.png || true
          bash src/scripts/ci/e2e-download.sh /root/Downloads 2>&1 | tee -a ci-out/install.log
          import -display :99 -window root ci-out/screen-after-download.png || true
          pkill -f open-download-manage[r] || true
          echo "launch and download ok" >> ci-out/install.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: logs-${{ matrix.distro }}-${{ matrix.arch }}
          path: ci-out/

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    permissions:
      contents: write
    uses: ./.github/workflows/macos-native.yml
    with:
      universal: true

  windows-native:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    uses: ./.github/workflows/windows-native.yml

  linux-native:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    uses: ./.github/workflows/linux-native.yml

  report:
    needs: [checks, linux, install-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: logs-*
          path: ci-out
      - name: Publish logs to the ci-output-desktop branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUMMARY: "checks=${{ needs.checks.result }} linux=${{ needs.linux.result }} install-test=${{ needs.install-test.result }}"
        run: |
          mkdir -p ci-out
          cd ci-out
          printf '%s\n' "run $GITHUB_RUN_ID · commit $GITHUB_SHA" "$SUMMARY" > RUN.txt
          git init -q
          git checkout -q -b ci-output-desktop
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for $GITHUB_SHA"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q -f "https://github.com/$REPO.git" ci-output-desktop

  release:
    needs: [linux, install-test, macos, windows-native, linux-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag matches the version
        run: scripts/ci/check-versions.sh "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: OpenDownloadManager-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            out/**/*.exe
            out/**/*.deb
            out/**/*.rpm
            out/**/*.dmg
