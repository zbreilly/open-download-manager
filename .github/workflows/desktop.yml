name: windows-linux

# Windows (x64) installers and Linux .deb (Debian/Ubuntu) and .rpm
# (Fedora) packages for x64 and ARM64. Each Linux package is installed
# and launched in a clean Debian or Fedora container on its own arch.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "apps/macos/**"
      - ".github/workflows/macos-native.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: windows-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p odm-core

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: windows }
      - name: Frontend and extension
        shell: bash
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          bash extension/build.sh
      - name: Bundle (NSIS + MSI)
        shell: bash
        working-directory: src-tauri
        run: |
          mkdir -p ../ci-out
          npx --yes @tauri-apps/cli@2 build --bundles nsis,msi 2>&1 | tee ../ci-out/build.log
          exit ${PIPESTATUS[0]}
      - name: Install silently and launch
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Open Download Manager\*.exe","$env:ProgramFiles\Open Download Manager\*.exe" -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $app) { Write-Error "installed app not found"; exit 1 }
          "installed: $($app.FullName)" | Tee-Object ci-out/install.log
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep 15
          if ($p.HasExited) { Write-Error "app exited early ($($p.ExitCode))"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("ci-out/windows.png")
          Stop-Process -Id $p.Id -Force
          "launch ok" | Tee-Object -Append ci-out/install.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows-x64
          path: ci-out/
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDownloadManager-Windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.arch }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm zip
      - name: Frontend and extension
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          bash extension/build.sh
      - name: Bundle (.deb + .rpm)
        working-directory: src-tauri
        run: |
          mkdir -p ../ci-out
          npx --yes @tauri-apps/cli@2 build --bundles deb,rpm 2>&1 | tee ../ci-out/build.log
          exit ${PIPESTATUS[0]}
      - name: Package info
        run: |
          ls -l target/release/bundle/deb target/release/bundle/rpm | tee ci-out/packages.txt
          dpkg-deb -I target/release/bundle/deb/*.deb | tee -a ci-out/packages.txt
          rpm -qpR target/release/bundle/rpm/*.rpm | tee -a ci-out/packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-build-linux-${{ matrix.arch }}
          path: ci-out/
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDownloadManager-Linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  install-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        distro: [debian, fedora]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    container: ${{ matrix.distro == 'debian' && 'debian:stable' || 'fedora:latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenDownloadManager-Linux-${{ matrix.arch }}
          path: pkg
      - name: Install package
        run: |
          mkdir -p ci-out
          if [ "${{ matrix.distro }}" = debian ]; then
            apt-get update
            apt-get install -y ./pkg/deb/*.deb xvfb xauth imagemagick dbus-x11 procps 2>&1 | tee ci-out/install.log
          else
            dnf install -y ./pkg/rpm/*.rpm xorg-x11-server-Xvfb ImageMagick dbus-x11 procps-ng 2>&1 | tee ci-out/install.log
          fi
          command -v open-download-manager | tee -a ci-out/install.log
      - name: Launch and screenshot
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          export DISPLAY=:99 HOME=/root
          dbus-launch open-download-manager > ci-out/app.log 2>&1 &
          sleep 20
          pgrep -f open-download-manage[r] || { echo "app exited early"; cat ci-out/app.log; exit 1; }
          import -display :99 -window root ci-out/screen.png || true
          pkill -f open-download-manage[r] || true
          echo "launch ok" >> ci-out/install.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.distro }}-${{ matrix.arch }}
          path: ci-out/

  report:
    needs: [windows, linux, install-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: ci-out
      - name: Publish logs to the ci-output-desktop branch
        run: |
          cd ci-out
          printf '%s\n' "run ${{ github.run_id }} · commit ${{ github.sha }}" \
            "windows=${{ needs.windows.result }} linux=${{ needs.linux.result }} install-test=${{ needs.install-test.result }}" > RUN.txt
          git init -q
          git checkout -q -b ci-output-desktop
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output-desktop

  release:
    needs: [windows, linux, install-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenDownloadManager-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/**/*.exe
            out/**/*.msi
            out/**/*.deb
            out/**/*.rpm
