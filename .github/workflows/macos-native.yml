name: macos-native

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "extension/**"
      - ".github/workflows/macos-native.yml"
  workflow_dispatch:
    inputs:
      universal:
        description: "Build a universal (Apple silicon + Intel) binary"
        type: boolean
        default: false

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swiftc --version

      - name: Type-check Swift
        run: |
          mkdir -p ci-out
          apps/macos/build.sh --typecheck 2>&1 | tee ci-out/typecheck.log

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-native

      - name: Engine tests
        run: cargo test -p odm-core

      - name: Build app
        run: |
          mkdir -p ci-out
          bash extension/build.sh
          if [ "${{ inputs.universal }}" = "true" ]; then
            apps/macos/build.sh --dmg --universal 2>&1 | tee ci-out/build.log
          else
            apps/macos/build.sh --dmg 2>&1 | tee ci-out/build.log
          fi

      - name: Smoke test and screenshots
        run: |
          set -x
          APP="$PWD/dist/macos-native/Open Download Manager.app"
          mkdir -p ci-out
          open "$APP"
          sleep 8
          pgrep -fl OpenDownloadManager || { echo "app exited early"; exit 1; }
          screencapture -x ci-out/01-main.png || true
          open "odm://add?url=https://proof.ovh.net/files/100Mb.dat"
          sleep 6
          screencapture -x ci-out/02-add.png || true
          osascript -e 'tell application "System Events" to keystroke return' || true
          sleep 6
          screencapture -x ci-out/03-downloading.png || true
          osascript -e 'tell application "Open Download Manager" to activate' -e 'tell application "System Events" to keystroke "n" using command down' || true
          sleep 3
          screencapture -x ci-out/03b-add-menu.png || true
          osascript -e 'tell application "System Events" to key code 53' || true
          osascript -e 'tell application "Open Download Manager" to activate' -e 'tell application "System Events" to keystroke "," using command down' || true
          sleep 3
          screencapture -x ci-out/04-settings.png || true
          log show --last 2m --predicate 'process == "OpenDownloadManager"' --style compact > ci-out/app.log 2>/dev/null || true
          pkill -f OpenDownloadManager || true

      - name: Publish CI output to the ci-output branch
        if: always()
        run: |
          [ -d ci-out ] || exit 0
          cd ci-out
          printf '%s\n' "run ${{ github.run_id }} · commit ${{ github.sha }} · ${{ job.status }}" > RUN.txt
          git init -q
          git checkout -q -b ci-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

      - name: Zip app
        run: |
          cd dist/macos-native
          ditto -c -k --keepParent "Open Download Manager.app" OpenDownloadManager-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDownloadManager-macOS
          path: |
            dist/macos-native/*.dmg
            dist/macos-native/*.zip
          retention-days: 14
