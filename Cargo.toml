[workspace]
resolver = "2"
members = ["crates/odm-core", "crates/odm-ffi", "crates/odm-linux", "crates/odm-ui", "apps/gnome", "apps/macos", "apps/plasma", "apps/windows", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Zach"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
