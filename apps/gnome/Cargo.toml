[package]
name = "odm-gnome"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Open Download Manager for GNOME (GTK 4 + libadwaita)"

[[bin]]
name = "odm-gnome"
path = "src/main.rs"

[dependencies]
odm-ffi = { path = "../../crates/odm-ffi" }
odm-linux = { path = "../../crates/odm-linux" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde_json = "1"
async-channel = "2"
