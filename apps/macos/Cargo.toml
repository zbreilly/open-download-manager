[package]
name = "odm-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Open Download Manager for macOS (AppKit through objc2)"

[[bin]]
name = "OpenDownloadManager"
path = "src/main.rs"

[dependencies]
odm-ui = { path = "../../crates/odm-ui" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
odm-ffi = { path = "../../crates/odm-ffi" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-user-notifications = "0.3"
objc2-service-management = "0.3"
objc2-uniform-type-identifiers = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
