[package]
name = "odm-plasma"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Open Download Manager for KDE Plasma (Kirigami / Qt 6)"

[[bin]]
name = "odm-plasma"
path = "src/main.rs"

[dependencies]
odm-ffi = { path = "../../crates/odm-ffi" }
odm-linux = { path = "../../crates/odm-linux" }
odm-ui = { path = "../../crates/odm-ui" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cxx-qt-lib-extras = "0.10"
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
