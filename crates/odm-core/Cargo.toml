[package]
name = "odm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Open Download Manager download engine: segmented HTTP(S) with dynamic splitting, resume, queues and scheduling"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "socks", "stream", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# AES-GCM and randomness for the browser-extension pairing (already used by rustls)
ring = "0.17"
base64 = "0.22"
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
thiserror = "2"
sha2 = "0.11"
md-5 = "0.11"
sha1 = "0.11"
percent-encoding = "2"
url = "2"
fs4 = "1"
scraper = "0.27"
dirs = "7"
tracing = "0.1"
bytes = "1"
# FTPS: TLS on the control and data connections, with the same trust store as HTTPS
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# HLS/DASH: DASH manifests are XML; AES-128 decryption of HLS segments
roxmltree = "0.20"
aes = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# the login Keychain, for the key that seals stored secrets
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# the Secret Service (GNOME Keyring, KWallet), for the same key
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
# DPAPI, for secrets stored in the database
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
