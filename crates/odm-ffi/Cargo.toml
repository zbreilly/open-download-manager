[package]
name = "odm-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C interface to the Open Download Manager engine (used by the native macOS app)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
odm-core = { path = "../odm-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
url = "2"

[features]
# adds a "__panic" method used by tests to check that panics never cross
# the C boundary
test-hooks = []
