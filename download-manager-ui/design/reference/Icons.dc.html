<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Download Manager icon library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{rootStyle}}">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap">
<div>
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Icon library</h1>
<p style="{{subStyle}}">{{count}} icons · 24-unit grid · 2-unit round stroke · currentColor. Second line under each name is the IDM element it replaces.</p>
</div>
<div role="group" aria-label="Filter icon groups" style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{chips}}" as="ch" hint-placeholder-count="7">
<button type="button" aria-pressed="{{ch.on}}" onClick="{{ch.pick}}" style="{{ch.style}}">{{ch.label}}</button>
</sc-for>
</div>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="{{headStyle}}">{{g.title}}</h2>
<div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{g.icons}}" as="ic" hint-placeholder-count="10">
<div style="{{cellStyle}}">
<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{ic.label}}" style="{{iconStyle}}">
<sc-for list="{{ic.els}}" as="e" hint-placeholder-count="3"><path d="{{e.d}}" fill="{{e.fill}}" stroke="{{e.stroke}}" stroke-width="{{sw}}"></path></sc-for>
</svg>
<div style="{{nameStyle}}">{{ic.id}}</div>
<div style="{{idmStyle}}">{{ic.idm}}</div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
