<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Queues and scheduler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 820px; height: 680px; box-sizing: border-box; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; line-height: 1.4; color: #E7E9EC; background: #14171C; border: 1px solid #262C35; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #262C35">
<h1 style="margin: 0; font-size: 15px; font-weight: 600">Queues &amp; scheduler</h1>
<button type="button" aria-label="Close" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 7px; border: 0; background: transparent; color: #98A1AD; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="flex: 1; display: flex; min-height: 0">
<nav aria-label="Queues" style="width: 210px; flex: none; border-right: 1px solid #262C35; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; background: #111418">
<button type="button" style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 7px; border: 0; background: transparent; color: #98A1AD; font: inherit; text-align: left; cursor: pointer"><span>Main queue</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">5</span></button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 7px; border: 0; background: rgba(91,157,255,0.16); color: #E7E9EC; font: inherit; font-weight: 600; text-align: left; cursor: pointer"><span>Overnight</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 400; color: #98A1AD">3</span></button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 7px; border: 0; background: transparent; color: #98A1AD; font: inherit; text-align: left; cursor: pointer"><span>Sync (check for updates)</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">0</span></button>
<button type="button" style="margin-top: 8px; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 7px; border: 1px dashed #333A45; background: transparent; color: #98A1AD; font: inherit; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New queue</button>
</nav>

<div style="flex: 1; min-width: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; overflow: auto">

<div style="display: flex; align-items: center; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; flex: 1">Overnight</h2>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #262C35; background: transparent; color: #E7E9EC; font: inherit; cursor: pointer">Start now</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #262C35; background: transparent; color: #E7E9EC; font: inherit; cursor: pointer">Stop</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; border: 1px solid #262C35; background: #1A1E24">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 500">Start at</span><input type="checkbox" checked aria-label="Enable start time" style="width: 16px; height: 16px; accent-color: #5B9DFF; margin: 0"></span>
<input type="time" value="01:00" style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #262C35; background: #0D0F12; color: #E7E9EC; font-family: 'JetBrains Mono', monospace; font-size: 14px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; border: 1px solid #262C35; background: #1A1E24">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 500">Stop at</span><input type="checkbox" checked aria-label="Enable stop time" style="width: 16px; height: 16px; accent-color: #5B9DFF; margin: 0"></span>
<input type="time" value="07:00" style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #262C35; background: #0D0F12; color: #E7E9EC; font-family: 'JetBrains Mono', monospace; font-size: 14px">
</label>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 12px; color: #98A1AD; padding: 0; margin-bottom: 8px">Repeat on</legend>
<div style="display: flex; gap: 6px">
<sc-for list="{{days}}" as="dy" hint-placeholder-count="7">
<button type="button" aria-pressed="{{dy.on}}" style="{{dy.style}}">{{dy.l}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #98A1AD">Files at the same time</span>
<div style="display: flex; align-items: center; height: 36px; border-radius: 8px; border: 1px solid #262C35; background: #0D0F12; overflow: hidden">
<button type="button" aria-label="Decrease" style="width: 36px; height: 100%; border: 0; background: transparent; color: #98A1AD; font: inherit; font-size: 16px; cursor: pointer">−</button>
<input type="text" value="3" style="flex: 1; min-width: 0; text-align: center; border: 0; background: transparent; color: #E7E9EC; font-family: 'JetBrains Mono', monospace; font-size: 14px">
<button type="button" aria-label="Increase" style="width: 36px; height: 100%; border: 0; background: transparent; color: #98A1AD; font: inherit; font-size: 16px; cursor: pointer">+</button>
</div>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #98A1AD">Retry failed downloads</span>
<select style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #262C35; background: #0D0F12; color: #E7E9EC; font: inherit"><option>10 times, 30 s apart</option><option>3 times</option><option>Never</option></select>
</label>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #98A1AD">When the queue finishes</span>
<select style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #262C35; background: #0D0F12; color: #E7E9EC; font: inherit"><option>Put computer to sleep</option><option>Shut down computer</option><option>Exit app</option><option>Do nothing</option></select>
</label>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #98A1AD">Order (drag to reorder)</span>
<ol style="margin: 0; padding: 0; list-style: none; border: 1px solid #262C35; border-radius: 10px; overflow: hidden">
<sc-for list="{{files}}" as="f" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #1F242B">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#6B7480" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A1AD; width: 18px">{{f.n}}</span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #98A1AD">{{f.size}}</span>
</li>
</sc-for>
</ol>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #262C35; background: #1A1E24">
<span style="color: #98A1AD; font-size: 12px">Next run: tonight 01:00 · 3 files · 8.4 GB</span>
<span style="flex: 1"></span>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #262C35; background: transparent; color: #E7E9EC; font: inherit; cursor: pointer">Cancel</button>
<button type="button" style="height: 36px; padding: 0 16px; border-radius: 8px; border: 0; background: #5B9DFF; color: #0A1426; font: inherit; font-weight: 600; cursor: pointer">Save schedule</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    var on = [true, true, true, true, true, false, false];
    return {
      days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (l, i) {
        return {
          l: l, on: on[i] ? 'true' : 'false',
          style: 'width: 52px; height: 34px; border-radius: 8px; font: inherit; font-size: 12px; cursor: pointer; border: 1px solid ' + (on[i] ? '#5B9DFF' : '#262C35') + '; background: ' + (on[i] ? 'rgba(91,157,255,0.16)' : 'transparent') + '; color: ' + (on[i] ? '#E7E9EC' : '#98A1AD') + '; font-weight: ' + (on[i] ? 600 : 400)
        };
      }),
      files: [
        { n: '1', name: 'field-recordings-vol2.zip', size: '2.10 GB' },
        { n: '2', name: 'dataset-shard-0043.tar.zst', size: '4.80 GB' },
        { n: '3', name: 'conference-keynote-2026.mkv', size: '1.52 GB' }
      ]
    };
  }
}
</script>
</body>
</html>
