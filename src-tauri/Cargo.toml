[package]
name = "open-download-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Open Download Manager"
default-run = "open-download-manager"

[lib]
name = "odm_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
odm-core = { path = "../crates/odm-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
parking_lot = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Power", "Win32_System_Threading"] }

[features]
# serve the bundled frontend (ui/dist) instead of the dev server.
# `tauri build` turns this on automatically; scripts/build-macos.sh passes it.
custom-protocol = ["tauri/custom-protocol"]
